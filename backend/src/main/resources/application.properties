# ============================================================
# 教学环境配置：价格与数量一律按整数刻度存储，禁止用浮点比较价格。
# ============================================================
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/matchingdb
spring.datasource.username=match
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# 表结构由 Hibernate 自动创建（教学用途）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 撮合规则（可被 /api/settings 读取，前后端共用同一套刻度定义）
matching.symbol=SYNTH-01
# 最小变动价位：1 个价格刻度 = 0.01 元；库里价格字段存整数刻度数
matching.tick-size=0.01
# 最小交易数量单位（手）；下单数量必须是其整数倍
matching.lot-size=1
