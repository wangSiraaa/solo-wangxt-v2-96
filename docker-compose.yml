services:
  postgres:
    image: postgres:16-alpine
    container_name: match-postgres
    environment:
      POSTGRES_DB: matchdb
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match
    ports:
      - "5432:5432"
    volumes:
      - match_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match -d matchdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  match_pgdata:
